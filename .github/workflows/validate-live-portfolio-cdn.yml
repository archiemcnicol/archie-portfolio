name: Diagnose live portfolio CDN images

on:
  push:
    branches:
      - portfolio-final-webp-fix
    paths:
      - .github/workflows/validate-live-portfolio-cdn.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare mutable CDN, pinned CDN and raw GitHub responses
        shell: bash
        run: |
          set -u
          ids=(
            18dAyt42f15vfiQdYb9H_Kzi1o9riwfT3
            1Gg6cdrLJfcAx5BrYsgry1tg2yUSnTMUF
            1KGzec0HOOtk-xtuIyINwesk0gkhWuZOy
            1P59hxLoR2K7r8vPW-sSFbbsvpnIsxdHg
            1RI29B5lcwkhPV5hhN6OFfJVdvyPhWThr
            1Vaxigbjr4n_2lOuIzDpxe2EsIlwj3Ywz
            1WeExibYtRiTUO7ToFtKmMvxaCdsf5uKJ
            1XbmIFrLTgb5JExjJ-5CcQZaIyZ6Zcfu9
            1XxJlFluopAC9ldRXalU_AKnELlxYX_zj
            1YdZ_0FQ92NIfhnwjYeW-Mv-3RYxdCuIA
            1a4XCo1YrNopaS3h1tXpUEodERRrVqePp
            1bQygrUEYMOakrH-yTWtGEJHUJWNkk8Tx
            1eBragPkQDz_ZkDM3qtE2VRfusjF2T415
            1j9AC3EfIQNiMsMUXLoYyl1r9aQqYdm3u
            1qf6tSQBBhLUXJ4CdAQ_NSMJSvD4sO2Zl
            1wbTdGCRcmHMtQ2MNhnFf1-c2REc0-WO7
          )
          sha=f4424c842c9ace2802fc9dfd718b7f62790e31a4
          failures=0
          for id in "${ids[@]}"; do
            echo "===== $id ====="
            for mode in main pinned raw; do
              case "$mode" in
                main) url="https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/${id}.webp" ;;
                pinned) url="https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@${sha}/public/portfolio/archive/${id}.webp" ;;
                raw) url="https://raw.githubusercontent.com/archiemcnicol/archie-portfolio/main/public/portfolio/archive/${id}.webp" ;;
              esac
              out="/tmp/${id}-${mode}"
              code=$(curl -L --connect-timeout 15 --max-time 45 -sS -o "$out" -w '%{http_code}' "$url" || echo CURLFAIL)
              bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
              kind=$(file -b "$out" 2>/dev/null || echo missing)
              echo "$mode HTTP=$code BYTES=$bytes TYPE=$kind"
              if [ "$code" != "200" ]; then
                echo "BODY:"
                head -c 400 "$out" 2>/dev/null || true
                echo
              fi
            done
          done
