name: Resolve brand TikTok URLs

on:
  push:
    paths:
      - .github/workflows/capture-brand-covers.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve campaign short links and inspect oEmbed
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://vm.tiktok.com/ZNRrSuv3S/'
            'https://vm.tiktok.com/ZNd7Wft36/'
            'https://vm.tiktok.com/ZNdUsJTCT/'
            'https://vm.tiktok.com/ZGeEcsen9/'
            'https://vm.tiktok.com/ZGeoh1to7/'
          )
          for u in "${urls[@]}"; do
            echo "=== $u ==="
            final=$(curl -sS -L --max-time 30 -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1' -o /tmp/page.html -w '%{url_effective}' "$u" || true)
            echo "FINAL=$final"
            echo "SIZE=$(wc -c < /tmp/page.html 2>/dev/null || echo 0)"
            grep -oE 'https://www\.tiktok\.com/@[^"? ]+/video/[0-9]+' /tmp/page.html | head -5 || true
            echo 'OEMBED SHORT:'
            curl -sS --max-time 20 -A 'Mozilla/5.0' "https://www.tiktok.com/oembed?url=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$u")" | head -c 1200 || true
            echo
            if [[ "$final" == *'/video/'* ]]; then
              echo 'OEMBED FINAL:'
              curl -sS --max-time 20 -A 'Mozilla/5.0' "https://www.tiktok.com/oembed?url=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$final")" | head -c 1800 || true
              echo
            fi
          done
