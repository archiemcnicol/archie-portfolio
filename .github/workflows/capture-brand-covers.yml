name: Capture Brand Work covers from profile feed

on:
  push:
    paths:
      - .github/workflows/capture-brand-covers.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract thumbnails from profile feed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade yt-dlp
          mkdir -p public/brand-work /tmp/brand-work
          profile='https://www.tiktok.com/@fitswitharchie'
          yt-dlp --flat-playlist --dump-single-json --playlist-end 600 "$profile" > /tmp/profile.json

          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          targets = {
              '7592653916953644310': 'nike-2026-01-07.webp',
              '7557375899180485910': 'boss-bottled-beyond-2025-10-04.webp',
              '7519140859351174422': 'moschino-toy-2025-06-23.webp',
              '7415251227971259680': 'superdry-2024-09-16.webp',
              '7417118589917859105': 'superdry-2024-09-21.webp',
          }

          data = json.load(open('/tmp/profile.json'))
          entries = {str(e.get('id')): e for e in (data.get('entries') or [])}
          print('PROFILE_ENTRIES', len(entries))

          for vid, out in targets.items():
              e = entries.get(vid)
              if not e:
                  raise SystemExit(f'Missing target id {vid}')
              print('\nTARGET', vid, out)
              print('TITLE', e.get('title'))
              print('ENTRY_KEYS', sorted(e.keys()))
              print('THUMBNAIL', e.get('thumbnail'))
              print('THUMBNAILS', e.get('thumbnails'))

              candidates = []
              if e.get('thumbnail'):
                  candidates.append(e['thumbnail'])
              for t in e.get('thumbnails') or []:
                  if isinstance(t, dict) and t.get('url'):
                      candidates.append(t['url'])

              seen = set()
              raw = f'/tmp/brand-work/{vid}.img'
              success = False
              for url in candidates:
                  if url in seen:
                      continue
                  seen.add(url)
                  print('TRY', url)
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1',
                      'Referer': 'https://www.tiktok.com/',
                      'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read()
                          print('STATUS', r.status, 'BYTES', len(body), 'TYPE', r.headers.get('content-type'))
                      if len(body) < 5000:
                          continue
                      open(raw, 'wb').write(body)
                      dest = os.path.join('public', 'brand-work', out)
                      p = subprocess.run([
                          'ffmpeg','-hide_banner','-loglevel','error','-y','-i',raw,
                          '-vf',"scale='min(900,iw)':-2",'-frames:v','1','-c:v','libwebp','-quality','90',dest
                      ])
                      if p.returncode == 0 and os.path.getsize(dest) > 5000:
                          success = True
                          print('SAVED', dest, os.path.getsize(dest))
                          break
                  except Exception as ex:
                      print('ERROR', type(ex).__name__, str(ex))
              if not success:
                  raise SystemExit(f'No usable profile thumbnail for {vid}')
          PY

          echo 'Final hashes:'
          sha256sum public/brand-work/*.webp
          test "$(sha256sum public/brand-work/*.webp | awk '{print $1}' | sort -u | wc -l)" -eq 5

      - name: Commit permanent cover assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand-work/*.webp
          if git diff --cached --quiet; then
            echo 'No cover changes to commit.'
          else
            git commit -m 'Add real TikTok campaign covers'
            git push origin HEAD:brand-work-refresh
          fi
