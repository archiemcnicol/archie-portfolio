name: Probe TikTok profile

on:
  push:
    paths:
      - .github/workflows/capture-brand-covers.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate profile videos with yt-dlp
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade yt-dlp
          yt-dlp --version
          profile='https://www.tiktok.com/@fitswitharchie'
          set +e
          yt-dlp --flat-playlist --dump-single-json --playlist-end 600 "$profile" > /tmp/profile.json 2>/tmp/yt.err
          code=$?
          set -e
          echo "EXIT=$code"
          echo '--- STDERR ---'
          cat /tmp/yt.err
          echo '--- JSON SIZE ---'
          wc -c /tmp/profile.json || true
          if [ -s /tmp/profile.json ]; then
            python3 - <<'PY'
          import json, datetime
          data=json.load(open('/tmp/profile.json'))
          entries=data.get('entries') or []
          print('ENTRIES',len(entries))
          targets=[
            ('Nike', datetime.datetime(2026,1,7,16,15,4,tzinfo=datetime.timezone.utc)),
            ('BOSS', datetime.datetime(2025,10,4,14,38,20,tzinfo=datetime.timezone.utc)),
            ('Moschino', datetime.datetime(2025,6,23,15,16,0,tzinfo=datetime.timezone.utc)),
            ('Superdry1', datetime.datetime(2024,9,16,14,42,4,tzinfo=datetime.timezone.utc)),
            ('Superdry2', datetime.datetime(2024,9,21,15,28,22,tzinfo=datetime.timezone.utc)),
          ]
          for e in entries:
            vid=str(e.get('id') or '')
            if not vid.isdigit():
              continue
            dt=datetime.datetime.fromtimestamp(int(vid)>>32, datetime.timezone.utc)
            for name,target in targets:
              if abs((dt-target).total_seconds()) < 86400:
                print(name, dt.isoformat(), vid, e.get('url'), e.get('title'))
          PY
          fi
          exit "$code"
