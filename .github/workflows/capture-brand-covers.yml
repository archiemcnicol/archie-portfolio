name: Recover Brand Work TikTok posts

on:
  push:
    paths:
      - .github/workflows/capture-brand-covers.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Recover posts through TikWM feed
        shell: bash
        run: |
          mkdir -p debug-brand-recovery
          python3 <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          OUT = 'debug-brand-recovery'
          TARGETS = {
              'nike-2026-01-07': '2026-01-07',
              'boss-bottled-beyond-2025-10-04': '2025-10-04',
              'moschino-toy-2025-06-23': '2025-06-23',
              'superdry-2024-09-16': '2024-09-16',
              'superdry-2024-09-21': '2024-09-21',
          }
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          def get_json(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Accept': 'application/json,text/plain,*/*',
                  'Referer': 'https://www.tikwm.com/',
              })
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read()
              return json.loads(raw)

          def parse_time(value):
              try:
                  if isinstance(value, str) and value.isdigit():
                      value = int(value)
                  if isinstance(value, (int, float)):
                      return dt.datetime.fromtimestamp(value, dt.timezone.utc)
              except Exception:
                  pass
              return None

          def post_time(post):
              for key in ('create_time', 'createTime', 'created_at', 'create_time_iso'):
                  if key in post:
                      parsed = parse_time(post.get(key))
                      if parsed:
                          return parsed
              try:
                  vid = str(post.get('video_id') or post.get('id') or post.get('aweme_id') or '')
                  if vid.isdigit():
                      seconds = int(vid) >> 32
                      return dt.datetime.fromtimestamp(seconds, dt.timezone.utc)
              except Exception:
                  pass
              return None

          def distance_days(when, target):
              t = dt.datetime.fromisoformat(target).replace(tzinfo=dt.timezone.utc) + dt.timedelta(hours=12)
              return abs((when - t).total_seconds()) / 86400

          info_url = 'https://www.tikwm.com/api/user/info?' + urllib.parse.urlencode({'unique_id': 'fitswitharchie'})
          try:
              info = get_json(info_url)
          except Exception as exc:
              info = {'error': str(exc)}
          with open(os.path.join(OUT, 'user-info.json'), 'w') as f:
              json.dump(info, f, indent=2)
          print('user info:', json.dumps(info)[:1200])

          cursor = '0'
          seen = {}
          pages = []
          for page_no in range(1, 35):
              url = 'https://www.tikwm.com/api/user/posts?' + urllib.parse.urlencode({
                  'unique_id': 'fitswitharchie',
                  'count': '35',
                  'cursor': cursor,
              })
              try:
                  payload = get_json(url)
              except Exception as exc:
                  print(f'page {page_no} failed: {exc}')
                  break
              data = payload.get('data') or {}
              videos = data.get('videos') or data.get('items') or data.get('item_list') or []
              if not isinstance(videos, list):
                  videos = []
              pages.append({'page': page_no, 'cursor': cursor, 'code': payload.get('code'), 'msg': payload.get('msg'), 'count': len(videos)})
              for post in videos:
                  if not isinstance(post, dict):
                      continue
                  key = str(post.get('video_id') or post.get('id') or post.get('aweme_id') or len(seen))
                  seen[key] = post
              new_cursor = str(data.get('cursor') or data.get('max_cursor') or '')
              has_more = data.get('hasMore')
              if has_more is None:
                  has_more = data.get('has_more')
              print(f'page {page_no}: {len(videos)} videos, total {len(seen)}, cursor {cursor} -> {new_cursor}, more={has_more}')
              if not videos or not new_cursor or new_cursor == cursor or has_more is False:
                  break
              cursor = new_cursor
              time.sleep(0.8)

          posts = list(seen.values())
          result = {'pages': pages, 'discovered': len(posts), 'targets': {}}
          for name, target in TARGETS.items():
              candidates = []
              for post in posts:
                  when = post_time(post)
                  if not when or distance_days(when, target) > 2.0:
                      continue
                  stats = post.get('stats') or {}
                  candidate = {
                      'id': str(post.get('video_id') or post.get('id') or post.get('aweme_id') or ''),
                      'create_time': when.isoformat(),
                      'title': post.get('title') or post.get('desc') or post.get('description'),
                      'likes': post.get('digg_count') or post.get('diggCount') or post.get('likes') or stats.get('diggCount') or stats.get('digg_count'),
                      'views': post.get('play_count') or post.get('playCount') or post.get('views') or stats.get('playCount') or stats.get('play_count'),
                      'comments': post.get('comment_count') or post.get('commentCount') or stats.get('commentCount'),
                      'shares': post.get('share_count') or post.get('shareCount') or stats.get('shareCount'),
                      'cover': post.get('origin_cover') or post.get('cover') or post.get('dynamic_cover') or (post.get('video') or {}).get('originCover') or (post.get('video') or {}).get('cover'),
                      'author': post.get('author'),
                      'distance_days': round(distance_days(when, target), 3),
                  }
                  candidate['_raw'] = post
                  candidates.append(candidate)
              candidates.sort(key=lambda c: c['distance_days'])
              result['targets'][name] = candidates[:12]
              print('\n' + name + ':')
              for candidate in candidates[:12]:
                  preview = {k:v for k,v in candidate.items() if k != '_raw'}
                  print(json.dumps(preview, ensure_ascii=False)[:1600])

              for idx, candidate in enumerate(candidates[:12]):
                  cover = candidate.get('cover')
                  if not cover or not isinstance(cover, str):
                      continue
                  try:
                      req = urllib.request.Request(cover, headers={'User-Agent': UA, 'Referer': 'https://www.tikwm.com/'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read()
                      if len(body) > 5000:
                          ext = '.webp' if body[:4] == b'RIFF' else '.jpg'
                          with open(os.path.join(OUT, f'{name}-{idx}{ext}'), 'wb') as f:
                              f.write(body)
                  except Exception as exc:
                      print('cover download failed:', exc)

          with open(os.path.join(OUT, 'recovery.json'), 'w') as f:
              json.dump(result, f, indent=2, ensure_ascii=False)
          PY

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-post-recovery
          path: debug-brand-recovery/
          if-no-files-found: warn
          retention-days: 3
