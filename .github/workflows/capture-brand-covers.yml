name: Recover Brand Work TikTok posts

on:
  push:
    paths:
      - .github/workflows/capture-brand-covers.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Recover posts through public TikTok data API
        shell: bash
        run: |
          mkdir -p debug-brand-recovery
          python3 <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          OUT = 'debug-brand-recovery'
          BASE = 'https://api.tik-data.com'
          TARGETS = {
              'nike-2026-01-07': '2026-01-07',
              'boss-bottled-beyond-2025-10-04': '2025-10-04',
              'moschino-toy-2025-06-23': '2025-06-23',
              'superdry-2024-09-16': '2024-09-16',
              'superdry-2024-09-21': '2024-09-21',
          }
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.loads(r.read())

          def find_first(root, keys):
              if isinstance(root, dict):
                  for key in keys:
                      value = root.get(key)
                      if value not in (None, '', [], {}):
                          return value
                  for value in root.values():
                      found = find_first(value, keys)
                      if found not in (None, '', [], {}):
                          return found
              elif isinstance(root, list):
                  for value in root:
                      found = find_first(value, keys)
                      if found not in (None, '', [], {}):
                          return found
              return None

          def collect_post_lists(root):
              best = []
              if isinstance(root, dict):
                  for key, value in root.items():
                      if isinstance(value, list) and key.lower() in {'itemlist','items','videos','awemelist','item_list','post_list','posts'}:
                          if len(value) > len(best): best = value
                      nested = collect_post_lists(value)
                      if len(nested) > len(best): best = nested
              elif isinstance(root, list):
                  for value in root:
                      nested = collect_post_lists(value)
                      if len(nested) > len(best): best = nested
              return best

          def parse_time(value):
              try:
                  if isinstance(value, str) and value.isdigit(): value = int(value)
                  if isinstance(value, (int, float)):
                      if value > 10_000_000_000: value /= 1000
                      return dt.datetime.fromtimestamp(value, dt.timezone.utc)
              except Exception: pass
              return None

          def post_time(post):
              for key in ('createTime','create_time','created_at','timestamp'):
                  parsed = parse_time(post.get(key)) if isinstance(post, dict) else None
                  if parsed: return parsed
              try:
                  vid = str(find_first(post, ['id','aweme_id','video_id']) or '')
                  if vid.isdigit(): return dt.datetime.fromtimestamp(int(vid) >> 32, dt.timezone.utc)
              except Exception: pass
              return None

          def distance_days(when, target):
              t = dt.datetime.fromisoformat(target).replace(tzinfo=dt.timezone.utc) + dt.timedelta(hours=12)
              return abs((when - t).total_seconds()) / 86400

          try:
              schema = get_json(BASE + '/api/openapi.json')
              with open(os.path.join(OUT, 'openapi.json'), 'w') as f: json.dump(schema, f, indent=2)
              for route in ['/api/v1/public/check', '/api/v1/public/posts']:
                  params = ((schema.get('paths') or {}).get(route) or {}).get('get', {}).get('parameters', [])
                  print(route, 'params:', [(p.get('name'), p.get('required')) for p in params])
          except Exception as exc:
              print('openapi failed:', exc)

          check = get_json(BASE + '/api/v1/public/check?' + urllib.parse.urlencode({'username':'fitswitharchie'}))
          with open(os.path.join(OUT, 'profile.json'), 'w') as f: json.dump(check, f, indent=2)
          print('profile:', json.dumps(check)[:1800])
          secuid = find_first(check, ['secUid','sec_uid','sec_user_id'])
          if not secuid:
              raise RuntimeError('Profile resolved but no secUid was found')
          print('secUid:', secuid)

          cursor = '0'
          seen = {}
          pages = []
          for page_no in range(1, 40):
              query = {'secUid': secuid, 'count': 30, 'cursor': cursor}
              payload = get_json(BASE + '/api/v1/public/posts?' + urllib.parse.urlencode(query))
              posts = collect_post_lists(payload)
              print(f'page {page_no}: {len(posts)} posts')
              pages.append({'page': page_no, 'cursor': cursor, 'count': len(posts)})
              for post in posts:
                  if not isinstance(post, dict): continue
                  pid = str(find_first(post, ['id','aweme_id','video_id']) or f'p{page_no}-{len(seen)}')
                  seen[pid] = post
              next_cursor = find_first(payload, ['cursor','maxCursor','max_cursor','nextCursor','next_cursor'])
              has_more = find_first(payload, ['hasMore','has_more'])
              if not posts or next_cursor in (None, '', cursor) or has_more is False:
                  break
              cursor = str(next_cursor)
              time.sleep(0.6)

          result = {'discovered': len(seen), 'pages': pages, 'targets': {}}
          for name, target in TARGETS.items():
              candidates = []
              for post in seen.values():
                  when = post_time(post)
                  if not when or distance_days(when, target) > 2.0: continue
                  stats = find_first(post, ['stats','statistics'])
                  if not isinstance(stats, dict): stats = {}
                  video = find_first(post, ['video'])
                  if not isinstance(video, dict): video = {}
                  author = find_first(post, ['author'])
                  if not isinstance(author, dict): author = {}
                  item = {
                      'id': str(find_first(post, ['id','aweme_id','video_id']) or ''),
                      'create_time': when.isoformat(),
                      'description': find_first(post, ['desc','description','title']),
                      'likes': find_first(stats, ['diggCount','digg_count','likes','likeCount']) or find_first(post, ['diggCount','digg_count','likes','likeCount']),
                      'views': find_first(stats, ['playCount','play_count','views','viewCount']) or find_first(post, ['playCount','play_count','views','viewCount']),
                      'comments': find_first(stats, ['commentCount','comment_count']),
                      'shares': find_first(stats, ['shareCount','share_count']),
                      'cover': find_first(video, ['originCover','origin_cover','cover','dynamicCover','dynamic_cover']) or find_first(post, ['originCover','origin_cover','cover','dynamicCover','dynamic_cover']),
                      'author': author.get('uniqueId') or author.get('unique_id') or author.get('nickname'),
                      'distance_days': round(distance_days(when, target), 3),
                  }
                  candidates.append(item)
              candidates.sort(key=lambda x: x['distance_days'])
              result['targets'][name] = candidates[:15]
              print('\n' + name)
              for item in candidates[:15]: print(json.dumps(item, ensure_ascii=False)[:1800])

              for idx, item in enumerate(candidates[:15]):
                  url = item.get('cover')
                  if not isinstance(url, str) or not url.startswith('http'): continue
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Referer': 'https://www.tiktok.com/'})
                      with urllib.request.urlopen(req, timeout=30) as r: body = r.read()
                      if len(body) > 5000:
                          ext = '.webp' if body[:4] == b'RIFF' else '.jpg'
                          with open(os.path.join(OUT, f'{name}-{idx}{ext}'), 'wb') as f: f.write(body)
                  except Exception as exc:
                      print('cover failed:', exc)

          with open(os.path.join(OUT, 'recovery.json'), 'w') as f: json.dump(result, f, indent=2, ensure_ascii=False)
          PY

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-post-recovery
          path: debug-brand-recovery/
          if-no-files-found: warn
          retention-days: 3
