name: Capture brand TikTok covers

on:
  push:
    paths:
      - .github/workflows/capture-brand-covers.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser tooling
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium

      - name: Capture permanent campaign covers
        shell: bash
        run: |
          mkdir -p public/brand-work debug-brand-covers
          cat > /tmp/capture-brand-covers.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';
          import sharp from 'sharp';

          const posts = {
            'nike-2026-01-07': 'https://vm.tiktok.com/ZNRrSuv3S/',
            'boss-bottled-beyond-2025-10-04': 'https://vm.tiktok.com/ZNd7Wft36/',
            'moschino-toy-2025-06-23': 'https://vm.tiktok.com/ZNdUsJTCT/',
            'superdry-2024-09-16': 'https://vm.tiktok.com/ZGeEcsen9/',
            'superdry-2024-09-21': 'https://vm.tiktok.com/ZGeoh1to7/',
          };

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--disable-blink-features=AutomationControlled',
              '--no-sandbox',
              '--disable-dev-shm-usage',
            ],
          });

          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            locale: 'en-GB',
            timezoneId: 'Europe/London',
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
            extraHTTPHeaders: {
              'accept-language': 'en-GB,en;q=0.9',
            },
          });

          async function clickCookieButtons(page) {
            const labels = ['Accept all', 'Accept All', 'Allow all', 'Agree', 'Accept'];
            for (const label of labels) {
              try {
                const button = page.getByRole('button', { name: label, exact: false }).first();
                if (await button.isVisible({ timeout: 1000 })) {
                  await button.click({ timeout: 2000 });
                  await page.waitForTimeout(1200);
                  return;
                }
              } catch {}
            }
          }

          async function saveRemoteImage(page, imageUrl, output) {
            if (!imageUrl || !/^https?:\/\//i.test(imageUrl)) return false;
            try {
              const response = await page.request.get(imageUrl, {
                headers: {
                  referer: page.url(),
                  accept: 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                },
                timeout: 30000,
              });
              if (!response.ok()) return false;
              const body = await response.body();
              const metadata = await sharp(body).metadata();
              if (!metadata.width || !metadata.height || metadata.width < 150 || metadata.height < 150) return false;
              await sharp(body).webp({ quality: 91 }).toFile(output);
              console.log(`Saved remote cover ${output} (${metadata.width}x${metadata.height})`);
              return true;
            } catch (error) {
              console.log(`Remote image failed: ${String(error)}`);
              return false;
            }
          }

          async function saveElementScreenshot(page, output) {
            const selectors = [
              'video',
              '[data-e2e="browse-video"]',
              '[data-e2e="video-player"]',
              '[class*="DivVideoContainer"]',
              'main img',
            ];
            for (const selector of selectors) {
              const locator = page.locator(selector).first();
              try {
                if (!(await locator.isVisible({ timeout: 1500 }))) continue;
                const box = await locator.boundingBox();
                if (!box || box.width < 180 || box.height < 250) continue;
                const png = await locator.screenshot({ type: 'png' });
                await sharp(png).webp({ quality: 91 }).toFile(output);
                console.log(`Saved element cover from ${selector}: ${output}`);
                return true;
              } catch {}
            }
            return false;
          }

          const failures = [];

          for (const [name, shortUrl] of Object.entries(posts)) {
            const page = await context.newPage();
            const output = path.join('public', 'brand-work', `${name}.webp`);
            try {
              console.log(`\n=== ${name} ===`);
              await page.goto(shortUrl, { waitUntil: 'domcontentloaded', timeout: 65000 });
              await page.waitForTimeout(7000);
              await clickCookieButtons(page);
              await page.waitForTimeout(3000);
              console.log(`Resolved URL: ${page.url()}`);
              console.log(`Title: ${await page.title()}`);

              await page.screenshot({ path: path.join('debug-brand-covers', `${name}-page.png`), fullPage: false });

              const candidates = await page.evaluate(() => {
                const values = [];
                const push = (value) => {
                  if (typeof value === 'string' && value.startsWith('http') && !values.includes(value)) values.push(value);
                };
                push(document.querySelector('meta[property="og:image"]')?.getAttribute('content'));
                push(document.querySelector('meta[name="twitter:image"]')?.getAttribute('content'));
                push(document.querySelector('video')?.getAttribute('poster'));
                for (const img of Array.from(document.querySelectorAll('img'))) {
                  const rect = img.getBoundingClientRect();
                  if (rect.width >= 180 && rect.height >= 250) push(img.currentSrc || img.src);
                }
                return values;
              });

              let saved = false;
              for (const imageUrl of candidates) {
                if (await saveRemoteImage(page, imageUrl, output)) {
                  saved = true;
                  break;
                }
              }

              if (!saved) saved = await saveElementScreenshot(page, output);
              if (!saved) throw new Error('No usable TikTok cover or video element was found');
            } catch (error) {
              console.error(`${name} failed: ${String(error)}`);
              failures.push(name);
            } finally {
              await page.close();
            }
          }

          await browser.close();

          if (failures.length) {
            throw new Error(`Cover capture failed for: ${failures.join(', ')}`);
          }
          JS
          node /tmp/capture-brand-covers.mjs

      - name: Upload browser debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-cover-debug
          path: debug-brand-covers/
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit permanent cover assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand-work/*.webp
          if git diff --cached --quiet; then
            echo "No cover changes to commit."
          else
            git commit -m "Store permanent Brand Work TikTok covers"
            git push
          fi
