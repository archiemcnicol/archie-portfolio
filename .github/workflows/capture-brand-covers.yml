name: Recover Brand Work TikTok posts

on:
  push:
    paths:
      - .github/workflows/capture-brand-covers.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lightweight browser tooling
        shell: bash
        run: |
          mkdir -p /tmp/brand-recovery
          cd /tmp/brand-recovery
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core sharp
          which google-chrome || which google-chrome-stable || true

      - name: Recover post IDs, metrics and covers
        shell: bash
        run: |
          mkdir -p debug-brand-recovery
          cat > /tmp/brand-recovery/recover.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright-core';
          import sharp from 'sharp';

          const targets = {
            'nike-2026-01-07': '2026-01-07',
            'boss-bottled-beyond-2025-10-04': '2025-10-04',
            'moschino-toy-2025-06-23': '2025-06-23',
            'superdry-2024-09-16': '2024-09-16',
            'superdry-2024-09-21': '2024-09-21',
          };
          const outDir = path.resolve(process.env.GITHUB_WORKSPACE, 'debug-brand-recovery');
          const chrome = fs.existsSync('/usr/bin/google-chrome')
            ? '/usr/bin/google-chrome'
            : '/usr/bin/google-chrome-stable';

          const browser = await chromium.launch({
            executablePath: chrome,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1200 },
            locale: 'en-GB',
            timezoneId: 'Europe/London',
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();

          async function dismiss(page) {
            for (const text of ['Accept all', 'Allow all', 'Not now', 'Maybe later']) {
              try {
                const button = page.getByRole('button', { name: text, exact: false }).first();
                if (await button.isVisible({ timeout: 500 })) await button.click({ timeout: 1000 });
              } catch {}
            }
            for (const selector of ['[data-e2e="modal-close-inner-button"]', 'button[aria-label="Close"]']) {
              try {
                const el = page.locator(selector).first();
                if (await el.isVisible({ timeout: 300 })) await el.click({ timeout: 800 });
              } catch {}
            }
          }

          function dateFromId(id) {
            try {
              const seconds = Number(BigInt(id) >> 32n);
              return new Date(seconds * 1000).toISOString();
            } catch { return null; }
          }

          function daysBetween(a, b) {
            return Math.abs(new Date(a).getTime() - new Date(`${b}T12:00:00Z`).getTime()) / 86400000;
          }

          function findVideoObject(root, id) {
            const seen = new Set();
            function walk(value, depth = 0) {
              if (!value || typeof value !== 'object' || depth > 16 || seen.has(value)) return null;
              seen.add(value);
              if (String(value.id ?? value.aweme_id ?? '') === id) {
                if (value.stats || value.video || value.desc || value.createTime) return value;
              }
              if (Array.isArray(value)) {
                for (const child of value) { const found = walk(child, depth + 1); if (found) return found; }
              } else {
                for (const child of Object.values(value)) { const found = walk(child, depth + 1); if (found) return found; }
              }
              return null;
            }
            return walk(root);
          }

          async function structuredVideo(page, id) {
            return page.evaluate((videoId) => {
              const scripts = [
                document.querySelector('#__UNIVERSAL_DATA_FOR_REHYDRATION__'),
                document.querySelector('#SIGI_STATE'),
              ].filter(Boolean);
              const seen = new Set();
              function walk(value, depth = 0) {
                if (!value || typeof value !== 'object' || depth > 16 || seen.has(value)) return null;
                seen.add(value);
                if (String(value.id ?? value.aweme_id ?? '') === videoId && (value.stats || value.video || value.desc || value.createTime)) return value;
                if (Array.isArray(value)) {
                  for (const child of value) { const found = walk(child, depth + 1); if (found) return found; }
                } else {
                  for (const child of Object.values(value)) { const found = walk(child, depth + 1); if (found) return found; }
                }
                return null;
              }
              for (const script of scripts) {
                try { const found = walk(JSON.parse(script.textContent || '{}')); if (found) return found; } catch {}
              }
              return null;
            }, id);
          }

          async function saveImage(page, url, output) {
            if (!url || !/^https?:\/\//.test(url)) return false;
            try {
              const response = await page.request.get(url, { headers: { referer: page.url() }, timeout: 20000 });
              if (!response.ok()) return false;
              const body = await response.body();
              const meta = await sharp(body).metadata();
              if (!meta.width || !meta.height || meta.width < 200 || meta.height < 200) return false;
              await sharp(body).webp({ quality: 92 }).toFile(output);
              return true;
            } catch { return false; }
          }

          console.log('Opening TikTok profile…');
          await page.goto('https://www.tiktok.com/@fitswitharchie', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(6000);
          await dismiss(page);
          const discovered = new Map();
          let stableRounds = 0;
          let previousCount = 0;

          for (let i = 0; i < 180; i++) {
            const hrefs = await page.locator('a[href*="/video/"]').evaluateAll((els) => els.map((el) => el.href));
            for (const href of hrefs) {
              const match = href.match(/\/video\/(\d{15,22})/);
              if (match) discovered.set(match[1], href.split('?')[0]);
            }
            if (discovered.size === previousCount) stableRounds += 1; else stableRounds = 0;
            previousCount = discovered.size;
            if (stableRounds >= 14 || discovered.size >= 700) break;
            await page.evaluate(() => window.scrollBy(0, Math.max(window.innerHeight * 2.4, 2200)));
            await page.waitForTimeout(500);
            if (i % 20 === 0) { await dismiss(page); console.log(`scroll ${i}: ${discovered.size} videos`); }
          }

          console.log(`Discovered ${discovered.size} video links`);
          await page.screenshot({ path: path.join(outDir, 'profile-final.png'), fullPage: false });

          const posts = [...discovered].map(([id, url]) => ({ id, url, createdAt: dateFromId(id) })).filter((p) => p.createdAt);
          const result = { profileUrl: page.url(), discoveredCount: posts.length, targets: {} };

          for (const [name, targetDate] of Object.entries(targets)) {
            const candidates = posts
              .filter((p) => daysBetween(p.createdAt, targetDate) <= 2.0)
              .sort((a, b) => daysBetween(a.createdAt, targetDate) - daysBetween(b.createdAt, targetDate));
            result.targets[name] = { targetDate, candidates: [] };
            console.log(`\n${name}: ${candidates.length} candidate(s)`);

            for (const candidate of candidates.slice(0, 8)) {
              const p = await context.newPage();
              try {
                await p.goto(candidate.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await p.waitForTimeout(4500);
                await dismiss(p);
                const object = await structuredVideo(p, candidate.id);
                const stats = object?.stats || object?.statsV2 || {};
                const dom = {};
                for (const [key, selectors] of Object.entries({
                  likes: ['[data-e2e="like-count"]', '[data-e2e="browse-like-count"]'],
                  comments: ['[data-e2e="comment-count"]', '[data-e2e="browse-comment-count"]'],
                  shares: ['[data-e2e="share-count"]', '[data-e2e="browse-share-count"]'],
                })) {
                  for (const selector of selectors) {
                    try {
                      const text = (await p.locator(selector).first().textContent({ timeout: 700 }))?.trim();
                      if (text) { dom[key] = text; break; }
                    } catch {}
                  }
                }
                const meta = await p.evaluate(() => ({
                  ogImage: document.querySelector('meta[property="og:image"]')?.getAttribute('content') || null,
                  description: document.querySelector('meta[property="og:description"]')?.getAttribute('content') || null,
                  title: document.title,
                }));
                const coverCandidates = [object?.video?.originCover, object?.video?.cover, object?.video?.dynamicCover, meta.ogImage].filter(Boolean);
                let coverFile = null;
                for (const imageUrl of coverCandidates) {
                  const file = path.join(outDir, `${name}-${candidate.id}.webp`);
                  if (await saveImage(p, imageUrl, file)) { coverFile = path.basename(file); break; }
                }
                const entry = {
                  ...candidate,
                  resolvedUrl: p.url(),
                  description: object?.desc || meta.description,
                  createTime: object?.createTime || null,
                  stats: {
                    likes: stats.diggCount ?? stats.digg_count ?? stats.likes ?? null,
                    views: stats.playCount ?? stats.play_count ?? stats.views ?? null,
                    comments: stats.commentCount ?? stats.comment_count ?? null,
                    shares: stats.shareCount ?? stats.share_count ?? null,
                  },
                  dom,
                  coverFile,
                  title: meta.title,
                };
                result.targets[name].candidates.push(entry);
                console.log(JSON.stringify(entry));
              } catch (error) {
                result.targets[name].candidates.push({ ...candidate, error: String(error) });
              } finally {
                await p.close();
              }
            }
          }

          fs.writeFileSync(path.join(outDir, 'recovery.json'), JSON.stringify(result, null, 2));
          await browser.close();
          JS
          cd /tmp/brand-recovery
          node recover.mjs

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-post-recovery
          path: debug-brand-recovery/
          if-no-files-found: warn
          retention-days: 3
