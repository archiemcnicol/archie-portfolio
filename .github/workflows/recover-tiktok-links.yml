name: Recover TikTok links
on:
  push:
    paths:
      - '.github/workflows/recover-tiktok-links.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install -q --upgrade yt-dlp
      - name: Try yt-dlp profile extraction
        continue-on-error: true
        run: |
          echo '=== YTDLP START ==='
          yt-dlp --flat-playlist --playlist-end 500 --print '%(id)s|%(timestamp)s|%(title)s|%(webpage_url)s' 'https://www.tiktok.com/@fitswitharchie' || true
          echo '=== YTDLP END ==='
      - name: Try public profile HTML
        continue-on-error: true
        run: |
          echo '=== HTML IDS START ==='
          curl -L --compressed -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36' -s 'https://www.tiktok.com/@fitswitharchie' -o /tmp/profile.html
          grep -oE 'video/[0-9]{15,22}' /tmp/profile.html | sort -u | head -500 || true
          grep -oE '"id":"[0-9]{15,22}"' /tmp/profile.html | sort -u | head -500 || true
          echo "HTML_BYTES=$(wc -c < /tmp/profile.html)"
          echo '=== HTML IDS END ==='
