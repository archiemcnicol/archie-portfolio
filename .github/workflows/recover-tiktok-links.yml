name: Recover TikTok links
on:
  push:
    paths:
      - '.github/workflows/recover-tiktok-links.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install -q --upgrade yt-dlp
      - name: Extract profile performance
        continue-on-error: true
        run: |
          echo '=== YTDLP STATS START ==='
          yt-dlp --flat-playlist --playlist-end 500 --print '%(id)s|%(timestamp)s|%(view_count)s|%(like_count)s|%(title)s|%(webpage_url)s' 'https://www.tiktok.com/@fitswitharchie' || true
          echo '=== YTDLP STATS END ==='
