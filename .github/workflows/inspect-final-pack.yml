name: Inspect final portfolio pack

on:
  push:
    paths:
      - .github/workflows/inspect-final-pack.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and inspect historical chunks
        shell: bash
        run: |
          set -euxo pipefail
          SRC=2ecd2815efe5d5cae1b883ef250437b19e579872
          for n in 000 001 002; do
            git show "$SRC:.final16/chunk-$n" >> /tmp/final16.b64
          done
          wc -c /tmp/final16.b64
          base64 -d /tmp/final16.b64 > /tmp/final16.tar
          ls -lh /tmp/final16.tar
          file /tmp/final16.tar
          echo '--- TAR LIST ---'
          tar tvf /tmp/final16.tar
          echo '--- EXTRACTED ---'
          mkdir -p /tmp/final16
          tar xf /tmp/final16.tar -C /tmp/final16
          find /tmp/final16 -type f -printf '%p %s bytes\n' | sort
          echo '--- IMAGE TYPES ---'
          find /tmp/final16 -type f -exec file {} \;
