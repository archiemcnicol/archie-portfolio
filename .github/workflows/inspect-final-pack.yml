name: Inspect final portfolio pack

on:
  push:
    paths:
      - .github/workflows/inspect-final-pack.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Drive thumbnail endpoints
        shell: bash
        run: |
          set -euo pipefail
          id='1Gg6cdrLJfcAx5BrYsgry1tg2yUSnTMUF'
          urls=(
            "https://lh3.googleusercontent.com/d/${id}=w800"
            "https://drive.google.com/thumbnail?id=${id}&sz=w800"
            "https://drive.google.com/uc?export=view&id=${id}"
          )
          n=0
          for url in "${urls[@]}"; do
            out="/tmp/test-$n"
            code=$(curl -L -sS --max-time 30 -w '%{http_code}' -o "$out" "$url" || true)
            echo "URL=$url HTTP=$code SIZE=$(wc -c < "$out" 2>/dev/null || echo 0) TYPE=$(file -b "$out" 2>/dev/null || true)"
            head -c 80 "$out" 2>/dev/null | strings | head -1 || true
            n=$((n+1))
          done
