name: Inspect final portfolio pack

on:
  push:
    paths:
      - .github/workflows/inspect-final-pack.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace staged transport commits
        shell: bash
        run: |
          set -euo pipefail
          git log --reverse --format='%H|%s' -- .final16 | while IFS='|' read -r c subject; do
            echo "=== $c :: $subject ==="
            git diff-tree --no-commit-id --name-status -r "$c" -- .final16 || true
            for p in $(git diff-tree --no-commit-id --name-only -r "$c" -- .final16 | sort -u); do
              if git cat-file -e "$c:$p" 2>/dev/null; then
                size=$(git cat-file -s "$c:$p")
                echo "FILE $p SIZE $size"
                printf 'HEAD '
                git show "$c:$p" | head -c 32 | xxd -p || true
              fi
            done
          done
