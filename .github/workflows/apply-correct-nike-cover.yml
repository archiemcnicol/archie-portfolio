name: Apply verified Nike Brand Work cover

on:
  push:
    branches:
      - brand-work-final
    paths:
      - .github/workflows/apply-correct-nike-cover.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-work-final
          fetch-depth: 0

      - name: Install dependencies and browser
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Recover and verify the exact Nike post cover
        shell: bash
        run: |
          cat > .apply-nike.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          import sharp from 'sharp';

          const canonical = 'https://www.tiktok.com/@fitswitharchie/video/7592280935027035414';
          const browser = await chromium.launch({ headless:true, args:['--disable-blink-features=AutomationControlled','--no-sandbox','--disable-dev-shm-usage'] });
          const context = await browser.newContext({
            viewport:{width:430,height:932}, locale:'en-GB', timezoneId:'Europe/London',
            userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
            extraHTTPHeaders:{'accept-language':'en-GB,en;q=0.9'},
          });
          const page = await context.newPage();
          await page.goto(canonical,{waitUntil:'domcontentloaded',timeout:65000});
          await page.waitForTimeout(9000);
          for (const label of ['Accept all','Accept All','Allow all','Agree','Accept']) {
            try { const b=page.getByRole('button',{name:label,exact:false}).first(); if(await b.isVisible({timeout:500})){await b.click();await page.waitForTimeout(1200);break;} } catch {}
          }
          await page.waitForTimeout(2500);
          const info=await page.evaluate(()=>({
            url:location.href,
            title:document.title,
            ogDescription:document.querySelector('meta[property="og:description"]')?.content||'',
            poster:document.querySelector('video')?.getAttribute('poster')||'',
          }));
          console.log(info);
          if (!info.url.includes('/video/7592280935027035414')) throw new Error(`TikTok did not stay on the expected video: ${info.url}`);
          if (!/Nike/i.test(`${info.title} ${info.ogDescription}`)) throw new Error(`Expected Nike post metadata, got: ${info.title} / ${info.ogDescription}`);
          if (!info.poster) throw new Error('Expected Nike video poster was not exposed');

          const r=await page.request.get(info.poster,{headers:{referer:canonical,accept:'image/avif,image/webp,image/*,*/*;q=0.8'},timeout:30000});
          if (!r.ok()) throw new Error(`Nike poster request failed: ${r.status()}`);
          const body=await r.body();
          const meta=await sharp(body).metadata();
          console.log(`Nike poster source: ${meta.format} ${meta.width}x${meta.height}, ${body.length} bytes`);
          if (!meta.width || !meta.height || meta.width < 500 || meta.height < 500) throw new Error('Nike poster dimensions are unexpectedly small');
          await sharp(body).webp({quality:94}).toFile('public/brand-work/nike-2026-01-07.webp');
          const finalMeta=await sharp('public/brand-work/nike-2026-01-07.webp').metadata();
          console.log(`Final Nike cover: ${finalMeta.format} ${finalMeta.width}x${finalMeta.height}, ${fs.statSync('public/brand-work/nike-2026-01-07.webp').size} bytes`);
          await browser.close();
          JS
          node .apply-nike.mjs
          rm .apply-nike.mjs

      - name: Validate Brand Work data and build
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const data=fs.readFileSync('src/lib/brand-work.ts','utf8');
          const page=fs.readFileSync('src/app/creator/page.tsx','utf8');
          const required=[
            'analytics: { likes: "134" }','analytics: { likes: "88" }','analytics: { likes: "93" }','660','2,954',
            'Jean Paul Gaultier','Sketch.co / All Points East','NOTION MGMT','KiLLOWEN — Pick Your Poison','KiLLOWEN — ALL 2 U',
            'KORA Works','Omar+ — Frozen','In Print We Trust','Domno Vintage','The Supermade','Whatnot'
          ];
          for(const value of required) if(!data.includes(value)) throw new Error(`Missing expected Brand Work value: ${value}`);
          if(/\bviews?\s*:/i.test(data)||/data status/i.test(data)||/\(export\)/i.test(data)) throw new Error('Legacy analytics copy remains');
          if(!page.includes('src={link.coverSrc!}')) throw new Error('Permanent campaign cover rendering is missing');
          if(page.includes('/api/tiktok-cover')) throw new Error('Old TikTok cover API is still referenced');
          NODE
          npm run build

      - name: Commit only the corrected Nike asset and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- package.json package-lock.json 2>/dev/null || true
          rm -f \
            .github/workflows/validate-brand-work-final.yml \
            .github/workflows/probe-nike-cover.yml \
            .github/workflows/recover-nike-from-export.yml \
            .github/workflows/recover-nike-canonical.yml \
            .github/workflows/apply-correct-nike-cover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Replace incorrect Nike campaign thumbnail with verified post cover'
          git push origin HEAD:brand-work-final
