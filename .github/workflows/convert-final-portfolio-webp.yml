name: Finalise portfolio archive WebP fix

on:
  push:
    branches:
      - portfolio-final-webp-fix
    paths:
      - .github/workflows/convert-final-portfolio-webp.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put all 16 photos into the same archive data structure as every working photo
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          records = [
              ("18dAyt42f15vfiQdYb9H_Kzi1o9riwfT3", "DJI_20250703103418_0005_D.jpg"),
              ("1Gg6cdrLJfcAx5BrYsgry1tg2yUSnTMUF", "DJI_20250831184910_0049_D.jpg"),
              ("1KGzec0HOOtk-xtuIyINwesk0gkhWuZOy", "DJI_20250831185213_0053_D.jpg"),
              ("1P59hxLoR2K7r8vPW-sSFbbsvpnIsxdHg", "DJI_20250831184747_0046_D.jpg"),
              ("1RI29B5lcwkhPV5hhN6OFfJVdvyPhWThr", "Photo00143.jpg"),
              ("1Vaxigbjr4n_2lOuIzDpxe2EsIlwj3Ywz", "DJI_20250814155451_0065_D.jpg"),
              ("1WeExibYtRiTUO7ToFtKmMvxaCdsf5uKJ", "Photo00099.jpg"),
              ("1XbmIFrLTgb5JExjJ-5CcQZaIyZ6Zcfu9", "Photo00041.jpg"),
              ("1XxJlFluopAC9ldRXalU_AKnELlxYX_zj", "DJI_20250831184827_0047_D.jpg"),
              ("1YdZ_0FQ92NIfhnwjYeW-Mv-3RYxdCuIA", "Photo00081.jpg"),
              ("1a4XCo1YrNopaS3h1tXpUEodERRrVqePp", "DJI_20260304160007_0006_D.jpg"),
              ("1bQygrUEYMOakrH-yTWtGEJHUJWNkk8Tx", "DJI_20250814155516_0066_D.jpg"),
              ("1eBragPkQDz_ZkDM3qtE2VRfusjF2T415", "DJI_20250814155425_0064_D.jpg"),
              ("1j9AC3EfIQNiMsMUXLoYyl1r9aQqYdm3u", "DJI_20250831185020_0050_D.jpg"),
              ("1qf6tSQBBhLUXJ4CdAQ_NSMJSvD4sO2Zl", "DJI_20260304155932_0005_D.jpg"),
              ("1wbTdGCRcmHMtQ2MNhnFf1-c2REc0-WO7", "DJI_20250831185228_0055_D.jpg"),
          ]

          archive_path = Path("src/lib/portfolio-archive.ts")
          archive = archive_path.read_text()
          if any(f'"id": "{photo_id}"' in archive for photo_id, _ in records):
              raise SystemExit("One or more final records are already present in the archive")

          entries = []
          for photo_id, original_name in records:
              webp = Path(f"public/portfolio/archive/{photo_id}.webp")
              if not webp.exists() or webp.stat().st_size < 1000:
                  raise SystemExit(f"Missing converted WebP: {webp}")
              entries.append(
                  "  {\n"
                  f'    "id": "{photo_id}",\n'
                  f'    "src": "https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/{photo_id}.webp",\n'
                  '    "width": 800,\n'
                  '    "height": 450,\n'
                  f'    "originalName": "{original_name}"\n'
                  "  }"
              )

          trimmed = archive.rstrip()
          if not trimmed.endswith("];"):
              raise SystemExit("Unexpected portfolio archive ending")
          trimmed = trimmed[:-2].rstrip()
          if not trimmed.endswith("}"):
              raise SystemExit("Unexpected final archive record")
          archive_path.write_text(trimmed + ",\n" + ",\n".join(entries) + "\n];\n")

          page_path = Path("src/app/photography/page.tsx")
          page = page_path.read_text()
          page = page.replace('import { PORTFOLIO_FINAL_PHOTOS } from "@/lib/portfolio-final";\n', '')
          page = page.replace('  ...PORTFOLIO_FINAL_PHOTOS,\n', '')
          page_path.write_text(page)

          final_path = Path("src/lib/portfolio-final.ts")
          if final_path.exists():
              final_path.unlink()

          updated = archive_path.read_text()
          for photo_id, _ in records:
              expected = f"https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/{photo_id}.webp"
              if updated.count(expected) != 1:
                  raise SystemExit(f"Archive entry not exactly once: {photo_id}")
          if updated.count('"originalName"') != 619:
              raise SystemExit(f"Expected 619 archive records, found {updated.count(chr(34) + 'originalName' + chr(34))}")
          if "PORTFOLIO_FINAL_PHOTOS" in page_path.read_text():
              raise SystemExit("Photography page still uses the separate final-photo list")
          if final_path.exists():
              raise SystemExit("Separate final-photo data file still exists")
          print("All 16 final photos now use the exact working archive WebP/CDN structure.")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build and typecheck
        run: |
          npm ci
          npm run build
          npm run typecheck

      - name: Commit archive-only implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/convert-final-portfolio-webp.yml
          git add src/lib/portfolio-archive.ts src/app/photography/page.tsx
          git add -u src/lib/portfolio-final.ts
          git commit -m 'Store final portfolio photos exactly like working archive photos'
          git push origin HEAD:portfolio-final-webp-fix
