name: Verify brand-work TikTok stats

on:
  push:
    paths:
      - '.github/workflows/check-brand-tiktok-stats.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search TikWM for campaign posts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import datetime as dt

          queries = ['BOSS fitswitharchie', 'Moschino fitswitharchie', 'Superdry fitswitharchie', 'fitswitharchie boss bottled beyond', 'fitswitharchie moschino toy']
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'

          for query in queries:
              print('\n===== QUERY:', query, '=====')
              url = 'https://www.tikwm.com/api/feed/search?' + urllib.parse.urlencode({'keywords': query, 'count': 30, 'cursor': 0, 'hd': 1})
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept':'application/json, text/plain, */*', 'Referer':'https://www.tikwm.com/'})
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      payload = json.loads(r.read())
              except Exception as e:
                  print('request failed:', repr(e)); continue
              print('code=', payload.get('code'), 'msg=', payload.get('msg'))
              data = payload.get('data') or {}
              videos = data.get('videos') or data.get('items') or []
              if not videos and isinstance(data, list): videos = data
              print('videos=', len(videos))
              for v in videos:
                  author = v.get('author') or {}
                  uid = author.get('unique_id') if isinstance(author, dict) else None
                  title = v.get('title') or v.get('desc') or ''
                  if uid == 'fitswitharchie' or 'fitswitharchie' in title.lower():
                      ts = v.get('create_time')
                      try: when = dt.datetime.fromtimestamp(int(ts), dt.timezone.utc).isoformat()
                      except Exception: when = str(ts)
                      print(json.dumps({
                          'id': str(v.get('video_id') or v.get('id') or ''),
                          'date': when,
                          'author': uid,
                          'title': title,
                          'likes': v.get('digg_count'),
                          'views': v.get('play_count'),
                          'comments': v.get('comment_count'),
                          'shares': v.get('share_count'),
                      }, ensure_ascii=False))
          PY
