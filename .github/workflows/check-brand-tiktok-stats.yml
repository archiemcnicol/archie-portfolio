name: Verify brand-work TikTok stats

on:
  push:
    paths:
      - '.github/workflows/check-brand-tiktok-stats.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Try alternate TikTok short-link hosts
        shell: bash
        run: |
          set -u
          codes=(
            'nike|ZNRrSuv3S'
            'boss|ZNd7Wft36'
            'moschino|ZNdUsJTCT'
            'superdry-one|ZGeEcsen9'
            'superdry-two|ZGeoh1to7'
          )
          ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          for entry in "${codes[@]}"; do
            name="${entry%%|*}"; code="${entry#*|}"
            echo "===== ${name} ====="
            for url in \
              "https://vm.tiktok.com/${code}/" \
              "https://vt.tiktok.com/${code}/" \
              "https://www.tiktok.com/t/${code}/"; do
              echo "--- ${url} ---"
              curl -sS -L --max-redirs 8 -o /dev/null -w 'http=%{http_code} effective=%{url_effective}\n' \
                -A "$ua" -H 'Accept-Language: en-GB,en;q=0.9' "$url" || true
            done
          done
