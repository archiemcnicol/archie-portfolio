name: Verify brand-work TikTok stats

on:
  push:
    paths:
      - '.github/workflows/check-brand-tiktok-stats.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect short-link redirects with multiple clients
        shell: bash
        run: |
          set -u
          urls=(
            'nike|https://vm.tiktok.com/ZNRrSuv3S/'
            'boss|https://vm.tiktok.com/ZNd7Wft36/'
            'moschino|https://vm.tiktok.com/ZNdUsJTCT/'
            'superdry-one|https://vm.tiktok.com/ZGeEcsen9/'
            'superdry-two|https://vm.tiktok.com/ZGeoh1to7/'
          )
          uas=(
            'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
            'Mozilla/5.0 (Linux; Android 15; Pixel 9 Pro) AppleWebKit/537.36 Chrome/152 Mobile Safari/537.36'
            'com.zhiliaoapp.musically/2023600030 (Linux; U; Android 15; en_GB; Pixel 9 Pro; Build/AP3A.241205.015; Cronet/TTNetVersion:5f9640e5 2025-01-01)'
          )
          for entry in "${urls[@]}"; do
            name="${entry%%|*}"; url="${entry#*|}"
            echo "===== ${name} ====="
            for ua in "${uas[@]}"; do
              echo "--- UA: ${ua:0:55} ---"
              curl -sS -D - -o /dev/null --max-redirs 0 -A "$ua" -H 'Accept-Language: en-GB,en;q=0.9' "$url" \
                | grep -Ei '^(HTTP/|location:|set-cookie:)' | head -n 12 || true
            done
          done
