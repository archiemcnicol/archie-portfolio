name: Verify brand-work TikTok stats

on:
  push:
    paths:
      - '.github/workflows/check-brand-tiktok-stats.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve short links through TikTok oEmbed
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'nike|https://vm.tiktok.com/ZNRrSuv3S/'
            'boss|https://vm.tiktok.com/ZNd7Wft36/'
            'moschino|https://vm.tiktok.com/ZNdUsJTCT/'
            'superdry-one|https://vm.tiktok.com/ZGeEcsen9/'
            'superdry-two|https://vm.tiktok.com/ZGeoh1to7/'
          )
          for entry in "${urls[@]}"; do
            name="${entry%%|*}"; url="${entry#*|}"
            echo "===== ${name} ====="
            payload="$(curl -sSLG 'https://www.tiktok.com/oembed' --data-urlencode "url=${url}" -A 'Mozilla/5.0' -H 'Accept: application/json')"
            echo "$payload" | jq -c '{title,author_name,author_url,html,thumbnail_url}'
          done
