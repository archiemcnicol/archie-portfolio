name: Verify brand-work TikTok stats

on:
  push:
    paths:
      - '.github/workflows/check-brand-tiktok-stats.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect Creafico analyzer frontend
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.creafico.com'
          page='/tmp/page.html'
          curl -fsSL -A 'Mozilla/5.0' "$base/tools/tiktok-profile-analyzer" -o "$page"
          echo "page bytes=$(wc -c < "$page")"
          echo '===== scripts ====='
          grep -oE 'src="[^"]+\.js[^"]*"' "$page" | sed 's/^src="//;s/"$//' | tail -n 30 | tee /tmp/scripts.txt
          echo '===== inline clues ====='
          grep -Eio '.{0,120}(tiktok|analy[sz]e|api/|username).{0,220}' "$page" | head -n 80 || true
          i=0
          while IFS= read -r src; do
            i=$((i+1))
            case "$src" in http*) url="$src";; *) url="$base$src";; esac
            curl -fsSL -A 'Mozilla/5.0' "$url" -o "/tmp/s${i}.js" || continue
            echo "===== script $i $src ====="
            grep -Eio '.{0,180}(tiktok|analy[sz]e|/api/|profile-analyzer|username).{0,300}' "/tmp/s${i}.js" | head -n 80 || true
          done < /tmp/scripts.txt
