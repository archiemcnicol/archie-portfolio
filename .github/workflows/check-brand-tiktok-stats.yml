name: Verify brand-work TikTok stats

on:
  push:
    paths:
      - '.github/workflows/check-brand-tiktok-stats.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe canonical Nike post metadata
        shell: bash
        run: |
          set -u
          canonical='https://www.tiktok.com/@7342225099493606432/video/7592280935027035414'
          echo '===== TikWM canonical ====='
          curl -sSLG 'https://www.tikwm.com/api/' --data-urlencode "url=${canonical}" --data-urlencode 'hd=1' \
            | jq -c '{code,msg,data:(if .data then {id:.data.id,title:.data.title,author:.data.author.unique_id,play_count:.data.play_count,digg_count:.data.digg_count,comment_count:.data.comment_count,share_count:.data.share_count,create_time:.data.create_time} else null end)}' || true
          echo '===== TikTok oEmbed ====='
          curl -sSLG 'https://www.tiktok.com/oembed' --data-urlencode "url=${canonical}" \
            -A 'Mozilla/5.0' -H 'Accept: application/json' | head -c 4000 || true
          echo
          echo '===== TikTok canonical page status + selected metadata ====='
          curl -sSL -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
            -H 'Accept-Language: en-GB,en;q=0.9' "$canonical" -o /tmp/page.html -w 'http=%{http_code} bytes=%{size_download} effective=%{url_effective}\n' || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/page.html').read_text(errors='ignore') if Path('/tmp/page.html').exists() else ''
          for pat in [r'"diggCount":\s*(\d+)', r'"playCount":\s*(\d+)', r'"commentCount":\s*(\d+)', r'"shareCount":\s*(\d+)', r'"uniqueId":"([^"]+)', r'7592280935027035414']:
              m = re.search(pat, text)
              print(pat, '=>', m.group(1) if m and m.lastindex else bool(m))
          PY
