name: Final development dependency cleanup

on:
  push:
    branches:
      - chore/final-production-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/final-production-cleanup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove unused development packages
        run: |
          npm ci
          npm uninstall --save-dev eslint eslint-config-next tailwindcss
          rm .github/workflows/final-dev-dependency-cleanup.yml

      - name: Commit cleaned dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/final-dev-dependency-cleanup.yml
          git commit -m "Remove unused development dependencies"
          git push origin HEAD:chore/final-production-cleanup
