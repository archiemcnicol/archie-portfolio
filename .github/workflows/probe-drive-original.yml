name: Probe Drive original

on:
  push:
    branches:
      - fix-photography-hq-source
    paths:
      - .github/workflows/probe-drive-original.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture Drive response
        shell: bash
        run: |
          set -euo pipefail
          ID='18dAyt42f15vfiQdYb9H_Kzi1o9riwfT3'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl -L --fail --retry 2 -A "$UA" -c drive-cookies.txt \
            "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" \
            -o drive-response.html
          echo "Captured: $(file -b drive-response.html), $(wc -c < drive-response.html) bytes"
          python3 - <<'PY'
          import re
          text=open('drive-response.html','r',encoding='utf-8',errors='ignore').read()
          urls=sorted(set(re.findall(r'https?[^"\'<> ]+',text)))
          print('URL-like strings containing drive/download/confirm:')
          for u in urls:
              if any(k in u.lower() for k in ['drive','download','confirm']):
                  print(u[:1000])
          print('confirm contexts:')
          for m in list(re.finditer('confirm',text,re.I))[:20]:
              print(text[max(0,m.start()-250):m.start()+500].replace('\n',' ')[:1000])
          PY
      - name: Upload captured response
        uses: actions/upload-artifact@v4
        with:
          name: drive-original-response
          path: |
            drive-response.html
            drive-cookies.txt
          retention-days: 1
