name: Verify Brand Work refresh

on:
  push:
    paths:
      - .github/workflows/verify-branch.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Audit repaired assets and Brand Work data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const fail = (m) => { throw new Error(m); };
          const read = (p) => fs.readFileSync(p, 'utf8');
          const brand = read('src/lib/brand-work.ts');
          const final = read('src/lib/portfolio-final.ts');
          const archive = read('src/lib/portfolio-archive.ts');

          const coverPaths = [...brand.matchAll(/coverSrc:\s*"([^"]+)"/g)].map(m => m[1]);
          if (coverPaths.length !== 5) fail(`Expected 5 Brand Work covers, found ${coverPaths.length}`);
          const hashes = new Set();
          for (const src of coverPaths) {
            if (!src.startsWith('/brand-work/') || !src.endsWith('.webp')) fail(`Unexpected cover path: ${src}`);
            const p = path.join('public', src);
            if (!fs.existsSync(p)) fail(`Missing cover asset: ${p}`);
            const buf = fs.readFileSync(p);
            if (buf.length <= 5000) fail(`Cover asset is suspiciously small: ${p} (${buf.length})`);
            hashes.add(crypto.createHash('sha256').update(buf).digest('hex'));
          }
          if (hashes.size !== 5) fail(`Expected 5 unique Brand Work covers, found ${hashes.size}`);

          if (/analytics\s*:\s*\{[^}]*\bviews\s*:/is.test(brand)) fail('Campaign analytics still contains Views');
          if (/data\s*status/i.test(brand)) fail('Brand Work data still contains Data status');
          if (/\(export\)/i.test(brand)) fail('Brand Work data still contains export suffix');
          const likes = [...brand.matchAll(/analytics:\s*\{\s*likes:\s*"([^"]+)"\s*\}/g)].map(m => m[1]);
          const expectedLikes = ['134', '88', '93', '660 + 2,954'];
          if (JSON.stringify(likes) !== JSON.stringify(expectedLikes)) fail(`Unexpected campaign likes: ${JSON.stringify(likes)}`);

          if (/\.pack#media=|PACK_SRC/.test(final)) fail('Final portfolio data still references packed fragment assets');
          const finalPaths = [...final.matchAll(/src:\s*"(\/portfolio\/archive\/final\/[^"]+\.avif)"/g)].map(m => m[1]);
          if (finalPaths.length !== 16) fail(`Expected 16 direct final portfolio assets, found ${finalPaths.length}`);
          for (const src of finalPaths) {
            const p = path.join('public', src);
            if (!fs.existsSync(p)) fail(`Missing final portfolio asset: ${p}`);
            if (fs.statSync(p).size <= 1000) fail(`Final portfolio asset is suspiciously small: ${p}`);
          }

          const archiveCount = [...archive.matchAll(/originalName:/g)].length;
          const exclusions = 3;
          console.log(`Archive records: ${archiveCount}`);
          console.log(`Final direct records: ${finalPaths.length}`);
          console.log(`Expected displayed photographs after exclusions: ${archiveCount + finalPaths.length - exclusions}`);
          console.log(`Verified ${coverPaths.length} unique permanent Brand Work covers.`);
          NODE
