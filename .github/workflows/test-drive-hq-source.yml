name: Test high-resolution Drive source access

on:
  push:
    branches:
      - portfolio-hq-refresh
    paths:
      - .github/workflows/test-drive-hq-source.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect anonymous Drive response
        shell: bash
        run: |
          set -u
          id='18dAyt42f15vfiQdYb9H_Kzi1o9riwfT3'
          url="https://drive.google.com/thumbnail?id=${id}&sz=w2000"
          out=/tmp/test.html
          code=$(curl -L --connect-timeout 15 --max-time 45 -sS -o "$out" -w '%{http_code}' "$url" || true)
          echo "HTTP=${code} BYTES=$(wc -c < "$out") TYPE=$(file -b "$out")"
          echo 'TITLE:'
          grep -o -m1 '<title[^>]*>[^<]*</title>' "$out" || true
          echo 'SIGN-IN MARKERS:'
          grep -Eio -m5 'sign in|accounts.google.com|request access|you need access|access denied|download anyway|virus scan' "$out" || true
          echo 'GOOGLEUSERCONTENT URLS:'
          grep -Eo 'https:[^" ]+(googleusercontent|usercontent)[^" ]+' "$out" | head -n 5 || true
