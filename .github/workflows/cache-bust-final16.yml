name: Cache-bust final 16 HQ portfolio images

on:
  push:
    paths:
      - '.github/hq-cache-bust-trigger'

permissions:
  contents: write

jobs:
  cache-bust-final16:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add a unique version to the final 16 image URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ids = [
              '18dAyt42f15vfiQdYb9H_Kzi1o9riwfT3',
              '1Gg6cdrLJfcAx5BrYsgry1tg2yUSnTMUF',
              '1KGzec0HOOtk-xtuIyINwesk0gkhWuZOy',
              '1P59hxLoR2K7r8vPW-sSFbbsvpnIsxdHg',
              '1RI29B5lcwkhPV5hhN6OFfJVdvyPhWThr',
              '1Vaxigbjr4n_2lOuIzDpxe2EsIlwj3Ywz',
              '1WeExibYtRiTUO7ToFtKmMvxaCdsf5uKJ',
              '1XbmIFrLTgb5JExjJ-5CcQZaIyZ6Zcfu9',
              '1XxJlFluopAC9ldRXalU_AKnELlxYX_zj',
              '1YdZ_0FQ92NIfhnwjYeW-Mv-3RYxdCuIA',
              '1a4XCo1YrNopaS3h1tXpUEodERRrVqePp',
              '1bQygrUEYMOakrH-yTWtGEJHUJWNkk8Tx',
              '1eBragPkQDz_ZkDM3qtE2VRfusjF2T415',
              '1j9AC3EfIQNiMsMUXLoYyl1r9aQqYdm3u',
              '1qf6tSQBBhLUXJ4CdAQ_NSMJSvD4sO2Zl',
              '1wbTdGCRcmHMtQ2MNhnFf1-c2REc0-WO7',
          ]
          version = 'hq3200-20260904'
          path = Path('src/lib/portfolio-archive.ts')
          text = path.read_text()
          original = text

          for photo_id in ids:
              base = f'https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/{photo_id}.webp'
              versioned = f'{base}?v={version}'
              if text.count(versioned) == 1:
                  continue
              count = text.count(base)
              if count != 1:
                  raise SystemExit(f'{photo_id}: expected exactly one unversioned URL, found {count}')
              text = text.replace(base, versioned, 1)

          if text == original:
              raise SystemExit('No cache-bust changes were needed')

          for photo_id in ids:
              expected = f'https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/{photo_id}.webp?v={version}'
              if text.count(expected) != 1:
                  raise SystemExit(f'{photo_id}: versioned URL verification failed')

          path.write_text(text)
          print('Versioned exactly 16 HQ portfolio source URLs.')
          PY

      - name: Commit only the cache-bust and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cache-bust-final16.yml .github/hq-cache-bust-trigger

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/portfolio-archive.ts .github/workflows/cache-bust-final16.yml .github/hq-cache-bust-trigger

          cat > /tmp/expected.txt <<'EOF'
          .github/hq-cache-bust-trigger
          .github/workflows/cache-bust-final16.yml
          src/lib/portfolio-archive.ts
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

          git diff --cached --quiet && { echo 'No staged changes'; exit 1; }
          git commit -m 'Bust image optimizer cache for final 16 HQ photos'
          git push origin HEAD:main
