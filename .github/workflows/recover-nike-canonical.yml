name: Recover Nike cover from canonical TikTok ID

on:
  push:
    branches:
      - brand-work-final
    paths:
      - .github/workflows/recover-nike-canonical.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install browser tooling
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium

      - name: Recover from canonical video ID
        shell: bash
        run: |
          mkdir -p nike-canonical
          cat > .recover-nike-canonical.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';
          import sharp from 'sharp';

          const urls = [
            'https://www.tiktok.com/@fitswitharchie/video/7592280935027035414',
            'https://www.tiktok.com/@7342225099493606432/video/7592280935027035414',
          ];
          const browser = await chromium.launch({ headless: true, args: ['--disable-blink-features=AutomationControlled','--no-sandbox','--disable-dev-shm-usage'] });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 }, locale: 'en-GB', timezoneId: 'Europe/London',
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
            extraHTTPHeaders: { 'accept-language':'en-GB,en;q=0.9' },
          });

          const report = [];
          let saved = 0;
          for (let uIndex=0; uIndex<urls.length; uIndex++) {
            const target = urls[uIndex];
            const page = await context.newPage();
            try {
              await page.goto(target, { waitUntil:'domcontentloaded', timeout:65000 });
              await page.waitForTimeout(8000);
              for (const label of ['Accept all','Accept All','Allow all','Agree','Accept']) {
                try { const b=page.getByRole('button',{name:label,exact:false}).first(); if(await b.isVisible({timeout:500})){await b.click();await page.waitForTimeout(1200);break;} } catch {}
              }
              await page.waitForTimeout(2500);
              const info = await page.evaluate(() => ({
                url: location.href,
                title: document.title,
                ogTitle: document.querySelector('meta[property="og:title"]')?.content || '',
                ogDescription: document.querySelector('meta[property="og:description"]')?.content || '',
                ogImage: document.querySelector('meta[property="og:image"]')?.content || '',
                twitterImage: document.querySelector('meta[name="twitter:image"]')?.content || '',
                poster: document.querySelector('video')?.getAttribute('poster') || '',
                body: (document.body?.innerText || '').slice(0,4000),
                images: Array.from(document.querySelectorAll('img')).map(img=>({src:img.currentSrc||img.src,w:img.naturalWidth,h:img.naturalHeight,alt:img.alt||''})).filter(x=>x.src&&x.w>=200&&x.h>=200).slice(0,20),
              }));
              await page.screenshot({ path:`nike-canonical/page-${uIndex}.png`, fullPage:false });
              report.push({ target, ...info });
              const candidates=[info.ogImage,info.twitterImage,info.poster,...info.images.map(x=>x.src)].filter(Boolean);
              for (const candidate of [...new Set(candidates)]) {
                try {
                  const r=await page.request.get(candidate,{headers:{referer:page.url(),accept:'image/avif,image/webp,image/*,*/*;q=0.8'},timeout:30000});
                  if(!r.ok()) continue;
                  const body=await r.body();
                  const meta=await sharp(body).metadata();
                  if(!meta.width||!meta.height||meta.width<250||meta.height<250) continue;
                  const out=path.join('nike-canonical',`candidate-${String(saved++).padStart(2,'0')}.webp`);
                  await sharp(body).webp({quality:94}).toFile(out);
                  console.log(`saved ${out} from ${candidate.slice(0,120)} (${meta.width}x${meta.height})`);
                } catch {}
              }
              try {
                const o=await page.request.get(`https://www.tiktok.com/oembed?url=${encodeURIComponent(target)}`,{timeout:30000});
                fs.writeFileSync(`nike-canonical/oembed-${uIndex}.txt`,`${o.status()}\n${await o.text()}`);
              } catch(e) { fs.writeFileSync(`nike-canonical/oembed-${uIndex}.txt`,String(e)); }
            } catch(e) { report.push({target,error:String(e)}); }
            finally { await page.close(); }
          }
          fs.writeFileSync('nike-canonical/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report.map(x=>({target:x.target,url:x.url,title:x.title,ogTitle:x.ogTitle,ogDescription:x.ogDescription})),null,2));
          console.log(`candidate files: ${saved}`);
          await browser.close();
          JS
          node .recover-nike-canonical.mjs
          rm .recover-nike-canonical.mjs

      - name: Upload canonical recovery
        uses: actions/upload-artifact@v4
        with:
          name: nike-canonical-recovery
          path: nike-canonical/
          retention-days: 1
