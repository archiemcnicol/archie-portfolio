name: Clean old Vercel deployments

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete old Vercel deployments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN repository secret."
            echo "Create a Vercel access token, then add it at Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Delete old deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/cleanup-vercel-deployments.mjs
