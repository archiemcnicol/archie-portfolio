name: Audit final portfolio image assets

on:
  push:
    paths:
      - .github/workflows/audit-portfolio-tail.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit portfolio entries 601-616
        shell: bash
        run: |
          python3 <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          text = Path('src/lib/portfolio-archive.ts').read_text()
          pattern = re.compile(
              r'\{\s*"id":\s*"([^"]+)".*?"src":\s*"([^"]+)".*?"width":\s*(\d+).*?"height":\s*(\d+).*?"originalName":\s*"([^"]+)"\s*\}',
              re.S,
          )
          entries = [
              {'id': m.group(1), 'src': m.group(2), 'width': int(m.group(3)), 'height': int(m.group(4)), 'name': m.group(5)}
              for m in pattern.finditer(text)
          ]
          print('TOTAL_ENTRIES', len(entries))
          results = []
          for index in range(600, min(616, len(entries))):
              e = entries[index]
              local = Path('public/portfolio/archive') / f"{e['id']}.webp"
              exists = local.exists()
              size = local.stat().st_size if exists else 0
              remote_status = None
              try:
                  req = urllib.request.Request(e['src'], method='HEAD', headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      remote_status = r.status
              except Exception as exc:
                  remote_status = f'ERR:{exc}'
              row = {
                  'index': index + 1,
                  **e,
                  'local_exists': exists,
                  'local_size': size,
                  'remote_status': remote_status,
              }
              results.append(row)
              print(json.dumps(row, ensure_ascii=False))
          Path('portfolio-tail-audit.json').write_text(json.dumps(results, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-tail-audit
          path: portfolio-tail-audit.json
          retention-days: 3
