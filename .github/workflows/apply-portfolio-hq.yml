name: Apply high-resolution portfolio replacements

on:
  push:
    branches:
      - portfolio-hq-refresh
    paths:
      - .github/workflows/apply-portfolio-hq.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-hq-refresh
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Replace final 16 portfolio images with 1120px originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/portfolio/archive
          tar -xzf .tmp/hq1120avif20.tar.gz -C public/portfolio/archive

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/portfolio-archive.ts')
          text = path.read_text()

          originals = {
            '18dAyt42f15vfiQdYb9H_Kzi1o9riwfT3': 'DJI_20250703103418_0005_D.jpg',
            '1Gg6cdrLJfcAx5BrYsgry1tg2yUSnTMUF': 'DJI_20250831184910_0049_D.jpg',
            '1KGzec0HOOtk-xtuIyINwesk0gkhWuZOy': 'DJI_20250831185213_0053_D.jpg',
            '1P59hxLoR2K7r8vPW-sSFbbsvpnIsxdHg': 'DJI_20250831184747_0046_D.jpg',
            '1RI29B5lcwkhPV5hhN6OFfJVdvyPhWThr': 'Photo00143.jpg',
            '1Vaxigbjr4n_2lOuIzDpxe2EsIlwj3Ywz': 'DJI_20250814155516_0066_D.jpg',
            '1WeExibYtRiTUO7ToFtKmMvxaCdsf5uKJ': 'Photo00099.jpg',
            '1XbmIFrLTgb5JExjJ-5CcQZaIyZ6Zcfu9': 'Photo00041.jpg',
            '1XxJlFluopAC9ldRXalU_AKnELlxYX_zj': 'DJI_20250831184827_0047_D.jpg',
            '1YdZ_0FQ92NIfhnwjYeW-Mv-3RYxdCuIA': 'Photo00081.jpg',
            '1a4XCo1YrNopaS3h1tXpUEodERRrVqePp': 'DJI_20260304160007_0006_D.jpg',
            '1bQygrUEYMOakrH-yTWtGEJHUJWNkk8Tx': 'DJI_20250814155451_0065_D.jpg',
            '1eBragPkQDz_ZkDM3qtE2VRfusjF2T415': 'DJI_20250814155425_0064_D.jpg',
            '1j9AC3EfIQNiMsMUXLoYyl1r9aQqYdm3u': 'DJI_20250831185020_0050_D.jpg',
            '1qf6tSQBBhLUXJ4CdAQ_NSMJSvD4sO2Zl': 'DJI_20260304155932_0005_D.jpg',
            '1wbTdGCRcmHMtQ2MNhnFf1-c2REc0-WO7': 'DJI_20250831185228_0055_D.jpg',
          }

          for image_id, original_name in originals.items():
              pattern = re.compile(
                  r'\{\n\s+"id": "' + re.escape(image_id) + r'",\n'
                  r'\s+"src": "[^"]+",\n'
                  r'\s+"width": \d+,\n'
                  r'\s+"height": \d+,\n'
                  r'\s+"originalName": "[^"]+"\n\s+\}'
              )
              replacement = (
                  '{\n'
                  f'    "id": "{image_id}",\n'
                  f'    "src": "https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/{image_id}.avif",\n'
                  '    "width": 1120,\n'
                  '    "height": 630,\n'
                  f'    "originalName": "{original_name}"\n'
                  '  }'
              )
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one archive record for {image_id}, found {count}')

          path.write_text(text)
          PY

          ids=(
            18dAyt42f15vfiQdYb9H_Kzi1o9riwfT3
            1Gg6cdrLJfcAx5BrYsgry1tg2yUSnTMUF
            1KGzec0HOOtk-xtuIyINwesk0gkhWuZOy
            1P59hxLoR2K7r8vPW-sSFbbsvpnIsxdHg
            1RI29B5lcwkhPV5hhN6OFfJVdvyPhWThr
            1Vaxigbjr4n_2lOuIzDpxe2EsIlwj3Ywz
            1WeExibYtRiTUO7ToFtKmMvxaCdsf5uKJ
            1XbmIFrLTgb5JExjJ-5CcQZaIyZ6Zcfu9
            1XxJlFluopAC9ldRXalU_AKnELlxYX_zj
            1YdZ_0FQ92NIfhnwjYeW-Mv-3RYxdCuIA
            1a4XCo1YrNopaS3h1tXpUEodERRrVqePp
            1bQygrUEYMOakrH-yTWtGEJHUJWNkk8Tx
            1eBragPkQDz_ZkDM3qtE2VRfusjF2T415
            1j9AC3EfIQNiMsMUXLoYyl1r9aQqYdm3u
            1qf6tSQBBhLUXJ4CdAQ_NSMJSvD4sO2Zl
            1wbTdGCRcmHMtQ2MNhnFf1-c2REc0-WO7
          )
          for id in "${ids[@]}"; do
            test -s "public/portfolio/archive/${id}.avif"
            rm -f "public/portfolio/archive/${id}.webp"
          done

      - name: Build
        run: npm run build

      - name: Commit clean high-resolution replacement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          rm -f .github/workflows/apply-portfolio-hq.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace final portfolio images with high-resolution originals"
          git push origin HEAD:portfolio-hq-refresh
