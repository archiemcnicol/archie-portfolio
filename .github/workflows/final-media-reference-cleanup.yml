name: Final media reference cleanup

on:
  push:
    branches:
      - chore/final-production-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/final-production-cleanup
          fetch-depth: 0

      - name: Point previews at retained production assets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/tiktok-frame-preview.tsx')
          text = path.read_text()
          replacements = {
              'https://res.cloudinary.com/i1xhlvd6/image/upload/v1788968155/nike-approved-1080.webp': '/brand-work/nike-2026-01-07.webp',
              'https://res.cloudinary.com/i1xhlvd6/image/upload/v1788968221/superdry-approved-1080.webp': '/brand-work/superdry-2024-09-16.webp',
              'https://res.cloudinary.com/i1xhlvd6/image/upload/v1788976238/tiktok-profile-avatar-centred-exact-v3.png': 'https://res.cloudinary.com/i1xhlvd6/image/upload/v1789012088/tiktok-profile-avatar-centred-zoomout-v9.jpg',
              "// User-approved HQ static covers for Nike and Superdry. Other campaigns continue to use\n// TikTok's live player. The static previews use stable CDN assets while retaining platform\n// identity and the same visual rhythm as the live previews without inventing engagement counts.": "// Retained static covers for Nike and Superdry. Other campaigns continue to use\n// TikTok's live player. These local production assets avoid duplicate external media while\n// retaining platform identity and the same visual rhythm as the live previews.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected reference: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm .github/workflows/final-media-reference-cleanup.yml

      - name: Commit cleaned media references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/tiktok-frame-preview.tsx .github/workflows/final-media-reference-cleanup.yml
          git commit -m "Point previews at retained production media"
          git push origin HEAD:chore/final-production-cleanup
