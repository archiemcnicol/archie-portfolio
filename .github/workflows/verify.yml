name: Verify portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Smoke-test every pinned photography asset
        shell: bash
        run: |
          set -euo pipefail
          mutable='https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/'
          pinned='https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@c1d1e173c706b9b4e250668b7aaa31747d5290ce/public/portfolio/archive/'
          mapfile -t files < <(grep -o 'https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/[^"[:space:]]*' src/lib/portfolio-archive.ts | sed "s#${mutable}##" | sort -u)
          test "${#files[@]}" -gt 500
          printf '%s\n' "${files[@]}" | xargs -P 20 -I '{}' bash -c 'curl --fail --silent --show-error --location --retry 3 --output /dev/null "$1$2"' _ "$pinned" '{}'
          echo "Verified ${#files[@]} pinned photography assets."
