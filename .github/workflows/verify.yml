name: Verify portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Compare immutable photography delivery sources
        shell: bash
        run: |
          set -euo pipefail
          mutable='https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/'
          jsdelivr='https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@c1d1e173c706b9b4e250668b7aaa31747d5290ce/public/portfolio/archive/'
          raw='https://raw.githubusercontent.com/archiemcnicol/archie-portfolio/c1d1e173c706b9b4e250668b7aaa31747d5290ce/public/portfolio/archive/'
          mapfile -t files < <(grep -o 'https://cdn.jsdelivr.net/gh/archiemcnicol/archie-portfolio@main/public/portfolio/archive/[^"[:space:]]*' src/lib/portfolio-archive.ts | sed "s#${mutable}##" | sort -u)
          test "${#files[@]}" -gt 500

          : > /tmp/jsdelivr-failures
          printf '%s\n' "${files[@]}" | xargs -P 20 -I '{}' bash -c 'curl --fail --silent --location --retry 2 --output /dev/null "$1$2" || echo "$2" >> /tmp/jsdelivr-failures' _ "$jsdelivr" '{}'
          echo "jsDelivr failures: $(wc -l < /tmp/jsdelivr-failures)"
          sort -u /tmp/jsdelivr-failures

          : > /tmp/raw-failures
          printf '%s\n' "${files[@]}" | xargs -P 20 -I '{}' bash -c 'curl --fail --silent --location --retry 2 --output /dev/null "$1$2" || echo "$2" >> /tmp/raw-failures' _ "$raw" '{}'
          echo "Raw GitHub failures: $(wc -l < /tmp/raw-failures)"
          sort -u /tmp/raw-failures
          test ! -s /tmp/raw-failures
          echo "Verified ${#files[@]} archive assets through immutable Raw GitHub URLs."
